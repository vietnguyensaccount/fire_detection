<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Camera</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background-color: #142f52;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .sidebar a:hover {
            background-color: #1e3c72;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            color: white;
        }

        h2 {
            margin-top: 0;
        }

        form {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        input[type="submit"], a.cancel-btn {
            display: inline-block;
            background-color: #c0392b;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        input[type="submit"]:hover {
            background-color: #a93226;
        }

        a.cancel-btn {
            background-color: #7f8c8d;
        }

        a.cancel-btn:hover {
            background-color: #707b7c;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Fire AI</h2>
        <a href="/events">Events</a>
        <a href="/camera">Cameras</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="main-content">
        <h2>Delete Camera</h2>
        <form method="POST" action="/camera/{{ cam.id }}/delete">
            <p>Are you sure you want to delete the camera <strong>{{ cam.name }}</strong> (ID: {{ cam.id }})?</p>
            <input type="submit" value="Yes, Delete Camera">
            <a href="/camera" class="cancel-btn">Cancel</a>
        </form>
    </div>

</body>
</html>
