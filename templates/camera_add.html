<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Camera</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background-color: #142f52;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .sidebar a:hover {
            background-color: #1e3c72;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            color: white;
        }

        h2 {
            margin-top: 0;
        }

        form {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #1e3c72;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #16315b;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🔥 Fire AI</h2>
        <a href="/events">Events</a>
        <a href="/camera">Cameras</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="main-content">
        <h2>Add Camera</h2>
        <form method="POST" action="/camera/add">

            <label for="rtsp">RTSP URL</label>
            <input type="text" id="rtsp" name="rtsp" placeholder="rtsp://user:pass@ip:port/stream" required>

            <input type="submit" value="Add Camera">
        </form>
    </div>

</body>
</html>
