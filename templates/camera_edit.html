<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Camera</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    form {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 12px;
      width: 400px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: none;
      border-radius: 6px;
    }

    input[type="submit"] {
      padding: 10px 20px;
      background-color: #1e3c72;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      background-color: #16315b;
    }

    a {
      color: #add8e6;
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>Edit Camera</h2>
  <form method="POST">
    <label for="new_id">Camera ID</label>
    <input type="text" id="new_id" name="new_id" placeholder="{{ cam['id'] }}" required>

    <label for="rtsp">RTSP Url</label>
    <input type="text" id="new_rtsp" name="new_rtsp" placeholder="{{ cam['rtsp'] }}" required>

    <input type="submit" value="Save Changes">
  </form>

  <a href="/camera">← Back to Camera List</a>
</body>
</html>
